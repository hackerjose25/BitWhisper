<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Mobile Device Outer Shell -->
  <rect x="5" y="5" width="350" height="630" rx="36" fill="#020617" stroke="#334155" stroke-width="3"/>

  <!-- Screen Area -->
  <rect x="15" y="15" width="330" height="610" rx="26" fill="url(#mobBg)"/>

  <!-- Notch / Dynamic Island -->
  <rect x="130" y="22" width="100" height="18" rx="9" fill="#020617"/>

  <!-- Mobile Topbar -->
  <g transform="translate(25, 52)">
    <circle cx="16" cy="16" r="14" fill="#1e293b"/>
    <text x="16" y="20" font-size="12" text-anchor="middle" fill="#38bdf8">☰</text>
    <text x="40" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc"># general</text>
    <rect x="180" y="6" width="100" height="20" rx="10" fill="rgba(6, 182, 212, 0.15)"/>
    <text x="230" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">🔒 AES-GCM</text>
  </g>

  <!-- Peer Status Strip -->
  <g transform="translate(25, 96)">
    <rect width="310" height="32" rx="8" fill="#1e293b"/>
    <circle cx="20" cy="16" r="4" fill="#10b981"/>
    <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Active: 3 Peers connected in P2P mesh</text>
  </g>

  <!-- Chat Messages in Mobile View -->
  <g transform="translate(25, 145)">
    <!-- Msg 1 -->
    <circle cx="14" cy="14" r="14" fill="#8b5cf6"/>
    <text x="14" y="18" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">A</text>
    <text x="36" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">Alex</text>
    <text x="36" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">ECDH derived! Ready for chat.</text>
    <rect x="36" y="34" width="36" height="16" rx="8" fill="#1e293b"/>
    <text x="54" y="46" font-size="9" text-anchor="middle">👍 1</text>
  </g>

  <g transform="translate(25, 215)">
    <!-- Msg 2 -->
    <circle cx="14" cy="14" r="14" fill="#0284c7"/>
    <text x="14" y="18" font-size="11" text-anchor="middle" fill="#fff" font-weight="bold">J</text>
    <text x="36" y="12" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Jose (You)</text>
    <text x="36" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#cbd5e1">Sending test contract file...</text>
  </g>

  <!-- File card in mobile -->
  <g transform="translate(55, 265)">
    <rect width="270" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="34" font-size="20">📄</text>
    <text x="50" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#f8fafc">smart-contract.sol</text>
    <text x="50" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94a3b8">SHA-256 Verified · 16KB stream</text>
  </g>

  <!-- Bottom Input Bar -->
  <g transform="translate(25, 560)">
    <rect width="310" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="18" y="28" font-size="14">📎</text>
    <text x="42" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748b">Encrypted message...</text>
    <circle cx="285" cy="23" r="15" fill="#0284c7"/>
    <text x="285" y="27" font-size="11" text-anchor="middle" fill="#fff">➤</text>
  </g>
</svg>
