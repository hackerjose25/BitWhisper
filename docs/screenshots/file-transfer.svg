<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="1000" height="500" rx="12" fill="url(#ftBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Title -->
  <g transform="translate(50, 45)">
    <rect width="200" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="100" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">PEER-TO-PEER DATA STREAM</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">16KB Chunked Transfer &amp; SHA-256 Verification</text>
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">Files are fragmented into 16KB blocks, encrypted individually with AES-GCM, and reconstructed with cryptographic checksum verification.</text>
  </g>

  <!-- Active Transfer Card Mockup -->
  <g transform="translate(150, 165)">
    <rect width="700" height="270" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.5))"/>

    <!-- File Icon & Details -->
    <rect x="35" y="35" width="56" height="56" rx="10" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="63" y="70" font-size="28" text-anchor="middle">📦</text>

    <text x="110" y="55" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">encrypted-database-export.tar.gz</text>
    <text x="110" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Size: 4.8 MB · Speed: 1.2 MB/s · Peer: 0x82b...9d12 (Alex)</text>

    <!-- Progress Bar -->
    <rect x="35" y="115" width="630" height="12" rx="6" fill="#1e293b"/>
    <rect x="35" y="115" width="520" height="12" rx="6" fill="url(#barGrad)"/>

    <text x="35" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Transferred: 300 / 307 Chunks (16 KB each)</text>
    <text x="665" y="150" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#10b981" text-anchor="end">97.7% Complete</text>

    <!-- SHA-256 Box -->
    <g transform="translate(35, 175)">
      <rect width="630" height="65" rx="8" fill="#1e293b" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <circle cx="25" cy="32" r="10" fill="rgba(16, 185, 129, 0.2)"/>
      <text x="25" y="36" font-size="12" text-anchor="middle">✓</text>
      
      <text x="45" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10b981">SHA-256 INTEGRITY VALIDATION</text>
      <text x="45" y="46" font-family="Courier New, monospace" font-size="11" fill="#cbd5e1">e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</text>
    </g>
  </g>
</svg>
