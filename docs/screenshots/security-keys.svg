<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="1000" height="480" rx="12" fill="url(#skBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Title -->
  <g transform="translate(50, 40)">
    <rect width="210" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="105" y="17" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#a855f7" text-anchor="middle">PERFECT FORWARD SECRECY</text>
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">Ephemeral ECDH P-256 Key Agreement</text>
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">Shared symmetric keys are derived mathematically in memory without ever being transmitted across the wire.</text>
  </g>

  <!-- Diagram Nodes -->
  <!-- Client A -->
  <g transform="translate(80, 160)">
    <rect width="250" height="250" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="125" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">Client A (Browser)</text>
    
    <rect x="20" y="55" width="210" height="42" rx="6" fill="#1e293b"/>
    <text x="30" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Generate Ephemeral Pair:</text>
    <text x="30" y="90" font-family="Courier New, monospace" font-size="10" fill="#f8fafc">PrivKey_A + PubKey_A</text>

    <rect x="20" y="110" width="210" height="42" rx="6" fill="#1e293b"/>
    <text x="30" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Receive from Peer B:</text>
    <text x="30" y="145" font-family="Courier New, monospace" font-size="10" fill="#a855f7">PubKey_B</text>

    <!-- Derivation Box -->
    <rect x="20" y="170" width="210" height="55" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="125" y="192" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">Derive Shared Secret:</text>
    <text x="125" y="210" font-family="Courier New, monospace" font-size="11" fill="#f8fafc" text-anchor="middle">ECDH(Priv_A, Pub_B)</text>
  </g>

  <!-- Middle Signaling / Wire -->
  <g transform="translate(380, 180)">
    <!-- Data Channel Line -->
    <line x1="0" y1="50" x2="240" y2="50" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 5"/>
    <polygon points="230,45 240,50 230,55" fill="#38bdf8"/>
    <rect x="50" y="32" width="140" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="120" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Send PubKey_A ➜</text>

    <line x1="240" y1="120" x2="0" y2="120" stroke="#a855f7" stroke-width="2" stroke-dasharray="5 5"/>
    <polygon points="10,115 0,120 10,125" fill="#a855f7"/>
    <rect x="50" y="102" width="140" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="120" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#a855f7" text-anchor="middle">⮜ Send PubKey_B</text>

    <!-- Center Lock Indicator -->
    <circle cx="120" cy="180" r="22" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="186" font-size="16" text-anchor="middle">🔐</text>
    <text x="120" y="218" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle">Zero-Knowledge Relay</text>
  </g>

  <!-- Client B -->
  <g transform="translate(670, 160)">
    <rect width="250" height="250" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="125" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#c084fc" text-anchor="middle">Client B (Browser)</text>
    
    <rect x="20" y="55" width="210" height="42" rx="6" fill="#1e293b"/>
    <text x="30" y="75" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Generate Ephemeral Pair:</text>
    <text x="30" y="90" font-family="Courier New, monospace" font-size="10" fill="#f8fafc">PrivKey_B + PubKey_B</text>

    <rect x="20" y="110" width="210" height="42" rx="6" fill="#1e293b"/>
    <text x="30" y="130" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8">Receive from Peer A:</text>
    <text x="30" y="145" font-family="Courier New, monospace" font-size="10" fill="#38bdf8">PubKey_A</text>

    <!-- Derivation Box -->
    <rect x="20" y="170" width="210" height="55" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="125" y="192" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">Derive Shared Secret:</text>
    <text x="125" y="210" font-family="Courier New, monospace" font-size="11" fill="#f8fafc" text-anchor="middle">ECDH(Priv_B, Pub_A)</text>
  </g>
</svg>
