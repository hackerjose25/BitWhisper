<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <radialGradient id="meshGlowCyan" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowPurple" cx="80%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshGlowEmerald" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.2)"/>
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filter for subtle drop shadow and glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#meshGlowCyan)"/>
  <rect width="1200" height="420" rx="16" fill="url(#meshGlowPurple)"/>
  <rect width="1200" height="420" rx="16" fill="url(#meshGlowEmerald)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="840" y1="0" x2="840" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
  </g>

  <!-- Abstract P2P Mesh Network Lines & Nodes (Left Accent) -->
  <g opacity="0.45" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="70" y1="120" x2="160" y2="80"/>
    <line x1="160" y1="80" x2="250" y2="150"/>
    <line x1="70" y1="120" x2="110" y2="240"/>
    <line x1="110" y1="240" x2="250" y2="150"/>
    <line x1="110" y1="240" x2="190" y2="330"/>
    <line x1="250" y1="150" x2="290" y2="280"/>
    <line x1="190" y1="330" x2="290" y2="280"/>
  </g>
  <circle cx="70" cy="120" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="160" cy="80" r="4" fill="#818cf8"/>
  <circle cx="250" cy="150" r="6" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="110" cy="240" r="5" fill="#34d399"/>
  <circle cx="190" cy="330" r="4" fill="#a855f7"/>
  <circle cx="290" cy="280" r="5" fill="#38bdf8"/>

  <!-- Abstract P2P Mesh Network Lines & Nodes (Right Accent) -->
  <g opacity="0.45" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="1130" y1="120" x2="1040" y2="80"/>
    <line x1="1040" y1="80" x2="950" y2="150"/>
    <line x1="1130" y1="120" x2="1090" y2="240"/>
    <line x1="1090" y1="240" x2="950" y2="150"/>
    <line x1="1090" y1="240" x2="1010" y2="330"/>
    <line x1="950" y1="150" x2="910" y2="280"/>
    <line x1="1010" y1="330" x2="910" y2="280"/>
  </g>
  <circle cx="1130" cy="120" r="5" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="1040" cy="80" r="4" fill="#818cf8"/>
  <circle cx="950" cy="150" r="6" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="1090" cy="240" r="5" fill="#38bdf8"/>
  <circle cx="1010" cy="330" r="4" fill="#34d399"/>
  <circle cx="910" cy="280" r="5" fill="#c084fc"/>

  <!-- Central Shield / Security Icon Container -->
  <g transform="translate(600, 95)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#titleGrad)" stroke-width="2" opacity="0.8" stroke-dasharray="6 4"/>
    <circle cx="0" cy="0" r="34" fill="#0f172a" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Shield / Lock Symbol -->
    <path d="M-12 -10 L12 -10 C12 6 0 16 0 16 C0 16 -12 6 -12 -10 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-2" r="3" fill="#a855f7"/>
    <path d="M0 1 L0 7" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <!-- Top Category / Badge Pill -->
  <g transform="translate(600, 165)">
    <rect x="-190" y="-14" width="380" height="28" rx="14" fill="#1e293b" stroke="url(#badgeBorder)" stroke-width="1"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="2">
      CODESTORM 2026: FUTUREFORGE · DEVFOLIO
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="52" font-weight="800" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="-1">
    BITWHISPER
  </text>

  <!-- Subtitle Tagline -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Web3 Authentication · WebRTC Mesh · Zero-Knowledge AES-GCM-256 Encryption
  </text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(600, 345)">
    <!-- Pill 1 -->
    <g transform="translate(-310, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <circle cx="-62" cy="0" r="4" fill="#38bdf8"/>
      <text x="-48" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Sign-In with Ethereum</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-100, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <circle cx="-62" cy="0" r="4" fill="#a855f7"/>
      <text x="-48" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">WebRTC Data Mesh</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(100, 0)">
      <rect x="-85" y="-16" width="170" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
      <circle cx="-62" cy="0" r="4" fill="#34d399"/>
      <text x="-48" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">ECDH Key Exchange</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(310, 0)">
      <rect x="-95" y="-16" width="190" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1"/>
      <circle cx="-72" cy="0" r="4" fill="#f43f5e"/>
      <text x="-58" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">16KB SHA-256 File Hash</text>
    </g>
  </g>
</svg>
