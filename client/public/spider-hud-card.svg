<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="hudCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090f" />
      <stop offset="50%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#110915" />
    </linearGradient>

    <linearGradient id="hudBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="meterGradRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#ff5252" />
    </linearGradient>

    <linearGradient id="meterGradCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#80deea" />
    </linearGradient>

    <linearGradient id="meterGradGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#fff59d" />
    </linearGradient>

    <filter id="hudNeonGlow">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect width="920" height="180" rx="14" />
    </clipPath>
  </defs>

  <style>
    @keyframes scanlineAnim {
      0% { transform: translateY(-10px); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(190px); opacity: 0; }
    }
    @keyframes pulseTarget {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    .hud-scanner {
      animation: scanlineAnim 4.5s linear infinite;
    }
    .target-crosshair {
      transform-origin: 820px 88px;
      animation: pulseTarget 2.5s ease-in-out infinite;
    }
    .hud-text {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      letter-spacing: 0.5px;
    }
    .hud-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Container Box -->
  <rect width="920" height="180" rx="14" fill="url(#hudCardBg)" stroke="url(#hudBorder)" stroke-width="1.2" />

  <!-- Scanning Sweep Laser Line -->
  <g clip-path="url(#cardClip)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#00f0ff" stroke-width="1.5" class="hud-scanner" filter="url(#hudNeonGlow)" />
  </g>

  <!-- Corner Brackets (HUD Tech aesthetic) -->
  <g stroke="#ff1744" stroke-width="2" fill="none">
    <path d="M 12,24 L 12,12 L 24,12" />
    <path d="M 908,24 L 908,12 L 896,12" />
    <path d="M 12,156 L 12,168 L 24,168" />
    <path d="M 908,156 L 908,168 L 896,168" />
  </g>

  <!-- ======================================================== -->
  <!-- COLUMN 1: REAL GITHUB OPERATIVE PROFILE (Left)           -->
  <!-- ======================================================== -->
  <g transform="translate(36, 26)">
    <!-- Section Header -->
    <text x="0" y="14" fill="#ff1744" font-size="12" class="hud-title">◈ DEVELOPER IDENTITY MATRIX</text>
    <line x1="0" y1="22" x2="250" y2="22" stroke="#ff1744" stroke-width="0.8" stroke-opacity="0.4" />

    <text x="0" y="44" fill="#94a3b8" font-size="11" class="hud-text">
      NAME: <tspan fill="#ffffff" font-weight="700">Jose Regish J</tspan> (<tspan fill="#00f0ff">@hackerjose25</tspan>)
    </text>
    <text x="0" y="64" fill="#94a3b8" font-size="11" class="hud-text">
      CAMPUS: <tspan fill="#e2e8f0">Loyola-ICAM (LICET)</tspan>
    </text>
    <text x="0" y="84" fill="#94a3b8" font-size="11" class="hud-text">
      BASE: <tspan fill="#e2e8f0">Nungambakkam, Chennai</tspan>
    </text>
    <text x="0" y="104" fill="#94a3b8" font-size="11" class="hud-text">
      PUBLIC REPOS: <tspan fill="#ffd700" font-weight="700">28 Repositories</tspan>
    </text>
    <text x="0" y="124" fill="#94a3b8" font-size="11" class="hud-text">
      PORTFOLIO: <tspan fill="#00f0ff">jose-portfolio-pi.vercel.app</tspan>
    </text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="315" y1="25" x2="315" y2="155" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- ======================================================== -->
  <!-- COLUMN 2: FULL-STACK & WEB3 ARCHITECTURE METRICS (Center)-->
  <!-- ======================================================== -->
  <g transform="translate(338, 26)">
    <text x="0" y="14" fill="#00f0ff" font-size="12" class="hud-title">⚡ FULL-STACK &amp; WEB3 CORE METRICS</text>
    <line x1="0" y1="22" x2="380" y2="22" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.4" />

    <!-- Metric 1: Full-Stack Web Development -->
    <g transform="translate(0, 32)">
      <text x="0" y="10" fill="#cbd5e1" font-size="10.5" class="hud-text">FULL-STACK CORE (REACT, NEXT.JS, NODE, TS)</text>
      <text x="330" y="10" fill="#00f0ff" font-size="10.5" font-weight="700" class="hud-text">98%</text>
      <!-- Track -->
      <rect x="0" y="14" width="350" height="6" rx="3" fill="#131b2c" />
      <rect x="0" y="14" width="343" height="6" rx="3" fill="url(#meterGradCyan)" filter="url(#hudNeonGlow)" />
    </g>

    <!-- Metric 2: Web3 & Blockchain (Solidity, Smart Contracts) -->
    <g transform="translate(0, 60)">
      <text x="0" y="10" fill="#cbd5e1" font-size="10.5" class="hud-text">WEB3 &amp; BLOCKCHAIN (SOLIDITY, DAPPS, EVM)</text>
      <text x="330" y="10" fill="#ff1744" font-size="10.5" font-weight="700" class="hud-text">97%</text>
      <!-- Track -->
      <rect x="0" y="14" width="350" height="6" rx="3" fill="#131b2c" />
      <rect x="0" y="14" width="339" height="6" rx="3" fill="url(#meterGradRed)" filter="url(#hudNeonGlow)" />
    </g>

    <!-- Metric 3: Smart Contract Security & Auditing -->
    <g transform="translate(0, 88)">
      <text x="0" y="10" fill="#cbd5e1" font-size="10.5" class="hud-text">SMART CONTRACT SECURITY &amp; AUDITING</text>
      <text x="330" y="10" fill="#ffd700" font-size="10.5" font-weight="700" class="hud-text">95%</text>
      <!-- Track -->
      <rect x="0" y="14" width="350" height="6" rx="3" fill="#131b2c" />
      <rect x="0" y="14" width="332" height="6" rx="3" fill="url(#meterGradGold)" />
    </g>

    <!-- Metric 4: Decentralized Protocol Scaling -->
    <g transform="translate(0, 116)">
      <text x="0" y="10" fill="#cbd5e1" font-size="10.5" class="hud-text">DECENTRALIZED ARCHITECTURES &amp; 3D LABS</text>
      <text x="330" y="10" fill="#80deea" font-size="10.5" font-weight="700" class="hud-text">93%</text>
      <!-- Track -->
      <rect x="0" y="14" width="350" height="6" rx="3" fill="#131b2c" />
      <rect x="0" y="14" width="325" height="6" rx="3" fill="url(#meterGradCyan)" />
    </g>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="745" y1="25" x2="155" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="4 4" />

  <!-- ======================================================== -->
  <!-- COLUMN 3: WEB3 RADAR & CHAIN TELEMETRY (Right)           -->
  <!-- ======================================================== -->
  <g transform="translate(760, 26)">
    <text x="0" y="14" fill="#ffd700" font-size="12" class="hud-title">🔗 WEB3 RADAR</text>
    <line x1="0" y1="22" x2="125" y2="22" stroke="#ffd700" stroke-width="0.8" stroke-opacity="0.4" />

    <!-- Radar Graphic -->
    <g class="target-crosshair" transform="translate(62, 74)">
      <circle cx="0" cy="0" r="32" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="4 2" />
      <circle cx="0" cy="0" r="22" fill="none" stroke="#ff1744" stroke-width="1" />
      <circle cx="0" cy="0" r="10" fill="none" stroke="#ffffff" stroke-width="0.6" />
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#00f0ff" stroke-width="0.75" />
      <line x1="0" y1="-36" x2="0" y2="36" stroke="#00f0ff" stroke-width="0.75" />
      <!-- Ethereum Diamond in Center -->
      <polygon points="0,-8 5,0 0,8 -5,0" fill="#00f0ff" />
      <polygon points="0,-8 5,0 0,2" fill="#ffffff" opacity="0.6" />
      <circle cx="12" cy="-12" r="2.5" fill="#ffd700" />
    </g>

    <text x="62" y="128" text-anchor="middle" fill="#00f0ff" font-size="9.5" class="hud-text">EVM: ACTIVE</text>
  </g>
</svg>
