<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 20" width="100%" height="20">
  <defs>
    <linearGradient id="spiderDivGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0" />
      <stop offset="18%" stop-color="#ff1744" stop-opacity="0.25" />
      <stop offset="42%" stop-color="#ff0055" stop-opacity="0.8" />
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="58%" stop-color="#ff0055" stop-opacity="0.8" />
      <stop offset="82%" stop-color="#ff1744" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="dividerCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#ff1744" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06080d" stop-opacity="0" />
    </radialGradient>

    <filter id="divNodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes divPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    .divider-pulsing-node {
      transform-origin: 460px 10px;
      animation: divPulse 2.8s ease-in-out infinite;
    }
  </style>

  <!-- Glowing Web Strand -->
  <line x1="30" y1="10" x2="890" y2="10" stroke="url(#spiderDivGrad)" stroke-width="1.4" />
  <line x1="120" y1="10" x2="800" y2="10" stroke="#00f0ff" stroke-width="0.6" stroke-opacity="0.4" />

  <!-- Secondary subtle web crosslines -->
  <line x1="435" y1="6" x2="485" y2="14" stroke="#ff1744" stroke-width="0.75" stroke-opacity="0.4" />
  <line x1="435" y1="14" x2="485" y2="6" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Center Glowing Spider Nanotech Node -->
  <g class="divider-pulsing-node">
    <circle cx="460" cy="10" r="7" fill="url(#dividerCenterGlow)" filter="url(#divNodeGlow)" />
    <!-- Mini Spider Emblem Diamond -->
    <polygon points="460,5 464,10 460,15 456,10" fill="#ffffff" />
    <circle cx="460" cy="10" r="1.5" fill="#ff1744" />
  </g>

  <!-- Lateral Web Nodes -->
  <circle cx="280" cy="10" r="2" fill="#ff1744" opacity="0.7" />
  <circle cx="640" cy="10" r="2" fill="#00f0ff" opacity="0.7" />
</svg>
